name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build fast key injector (runs on the Fire Stick)
        run: |
          PLATFORM=$(ls -d $ANDROID_HOME/platforms/android-* | sort -V | tail -1)
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          mkdir -p injector/out app/src/main/assets
          javac -source 8 -target 8 -nowarn -cp $PLATFORM/android.jar -d injector/out injector/src/com/luke/fireremote/Injector.java
          $BT/d8 --min-api 21 --lib $PLATFORM/android.jar --output app/src/main/assets/injector.jar injector/out/com/luke/fireremote/Injector.class
          ls -la app/src/main/assets

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E -A3 "^e: |What went wrong" build.log | grep -v "^--$" | head -9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FireRemote.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" FireRemote.apk \
            --title "Fire Remote (build ${{ github.run_number }})" \
            --notes "Download FireRemote.apk on your phone and open it to install." \
            --latest
