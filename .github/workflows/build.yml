name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log || {
            grep -E -A3 "^e: |What went wrong" build.log | grep -v "^--$" | head -9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FireRemote.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" FireRemote.apk \
            --title "Fire Remote (build ${{ github.run_number }})" \
            --notes "Download FireRemote.apk on your phone and open it to install." \
            --latest
